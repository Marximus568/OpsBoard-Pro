<div class="chart-card">
    <h3>Tendencia de Incidentes (7d)</h3>
    <div class="svg-container">
        <svg viewBox="0 0 400 200" preserveAspectRatio="none">
            <!-- Grid Lines -->
            <line x1="0" y1="50" x2="400" y2="50" class="grid-line" />
            <line x1="0" y1="100" x2="400" y2="100" class="grid-line" />
            <line x1="0" y1="150" x2="400" y2="150" class="grid-line" />

            <!-- Area -->
            <path [attr.d]="areaPath()" class="chart-area" />

            <!-- Line -->
            <path [attr.d]="linePath()" class="chart-line" />

            <!-- Points -->
            @for (p of points(); track $index) {
            <circle [attr.cx]="p.x" [attr.cy]="p.y" r="4" class="chart-point" />
            }
        </svg>
    </div>
    <div class="labels">
        @for (p of data; track p.date) {
        <span>{{ p.date.split('-')[2] }}/{{ p.date.split('-')[1] }}</span>
        }
    </div>
</div>
