<div class="role-management-container">
    <div class="page-header">
        <h1>Role Management (RBAC)</h1>
        <app-button variant="primary">
            <app-icon name="plus" size="sm"></app-icon> Add Role
        </app-button>
    </div>

    <div class="roles-grid">
        <div class="role-card" *ngFor="let role of roles()">
            <div class="role-header">
                <h3>{{ role.name }}</h3>
                <span class="role-id">{{ role.id }}</span>
            </div>

            <div class="role-actions">
                <button class="action-btn" (click)="toggleExpand(role.id)">
                    {{ expandedRoleId() === role.id ? 'Hide Permissions' : 'View Permissions' }}
                </button>
                <button class="action-btn edit">Edit</button>
            </div>

            <div class="permissions-list" *ngIf="expandedRoleId() === role.id">
                <div class="permission-tag" *ngFor="let perm of role.permissions">
                    {{ perm }}
                </div>
            </div>
        </div>
    </div>
</div>
